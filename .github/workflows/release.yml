name: Build & Release APK

on:
  release:
    types: [published, created]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (both, release, debug)'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - release
          - debug
      custom_tag:
        description: 'Custom Tag or Version Name (optional)'
        required: false
        default: ''

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Grant Execute Permission to Gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "gradlew not found, will use system gradle"
          fi

      - name: Setup Environment Files
        env:
          GEMINI_API_KEY_SECRET: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Preparing .env configuration..."
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          if [ -n "$GEMINI_API_KEY_SECRET" ]; then
            sed -i '/GEMINI_API_KEY=/d' .env
            echo "GEMINI_API_KEY=$GEMINI_API_KEY_SECRET" >> .env
          fi

          # Ensure mock google-services.json exists if not provided
          if [ ! -f "app/google-services.json" ]; then
            echo "Creating fallback google-services.json for build..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "crystal-bot-project",
              "storage_bucket": "crystal-bot.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "com.aistudio.crystalbot.zqkvrx"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummy_api_key_for_build"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Restore Keystores for Signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "Configuring signing keystores..."

          # 1. Restore or generate debug.keystore for debugConfig
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              (base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore) || true
            fi
          fi

          if [ ! -f "debug.keystore" ]; then
            echo "debug.keystore not present; generating via keytool..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "debug.keystore is ready."

          # 2. Restore or generate upload keystore with alias 'upload'
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | (base64 -d 2>/dev/null || base64 --decode) > my-upload-key.jks
            echo "Restored custom release keystore from GitHub Secret."
          elif [ ! -f "my-upload-key.jks" ]; then
            echo "Generating release keystore with alias 'upload' via keytool..."
            keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Crystal Bot Release,O=CrystalBot,C=US"
            echo "Generated my-upload-key.jks successfully."
          fi

          ls -lh debug.keystore my-upload-key.jks

      - name: Build APKs with Gradle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          BUILD_CMD="./gradlew"
          if [ ! -f "$BUILD_CMD" ]; then
            BUILD_CMD="gradle"
          fi

          BUILD_OPT="${{ inputs.build_type || 'both' }}"
          echo "Building with option: $BUILD_OPT using $BUILD_CMD"

          case "$BUILD_OPT" in
            "release")
              $BUILD_CMD assembleRelease --stacktrace
              ;;
            "debug")
              $BUILD_CMD assembleDebug --stacktrace
              ;;
            *)
              $BUILD_CMD assembleDebug assembleRelease --stacktrace
              ;;
          esac

      - name: Collect and Name APK Outputs
        id: collect_apks
        run: |
          mkdir -p release-apks
          RAW_TAG="${{ github.event.release.tag_name || github.ref_name || inputs.custom_tag || 'v1.0.0' }}"
          TAG_CLEAN=$(echo "$RAW_TAG" | tr '/' '-')

          FOUND=0
          # Search for all generated APK files in app build outputs
          while IFS= read -r apk_path; do
            if [ -n "$apk_path" ] && [ -f "$apk_path" ]; then
              BASE_NAME=$(basename "$apk_path")
              TARGET_FILE="release-apks/CrystalBot-${TAG_CLEAN}-${BASE_NAME}"
              cp "$apk_path" "$TARGET_FILE"
              echo "Collected APK: $TARGET_FILE"
              FOUND=$((FOUND + 1))
            fi
          done < <(find app/build/outputs/apk -type f -name "*.apk" 2>/dev/null)

          if [ $FOUND -eq 0 ]; then
            echo "::error::No APK files found in app/build/outputs/apk!"
            exit 1
          fi

          echo "apk_count=$FOUND" >> $GITHUB_OUTPUT
          echo "Found $FOUND APK(s):"
          ls -lh release-apks/

      - name: Upload APKs to GitHub Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: crystalbot-apks-${{ github.sha }}
          path: release-apks/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload APK to GitHub Release Assets
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.custom_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
          fail_on_unmatched_files: false
          generate_release_notes: true
          tag_name: ${{ github.event.release.tag_name || github.ref_name || inputs.custom_tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
